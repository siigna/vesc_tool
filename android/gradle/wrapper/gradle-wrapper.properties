distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 4.6 could not parse a JDK 11 version string at all:
#
#     Could not determine java version from '11.0.32'.
#
# JDK 11 is what Qt 5.15.8 and later want ("As of Qt 5.15.8, JDK 11 or later
# is supported for Qt for Android"), and JDK 8 is both unavailable here and
# past end of life. Gradle 6.7.1 is the oldest release that handles JDK 11 and
# that AGP 4.2.2 accepts.
distributionUrl=https\://services.gradle.org/distributions/gradle-6.7.1-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
