/*
 * Gradle configuration for the Android package.
 *
 * This replaces upstream's, which was AGP 3.2.0 on Gradle 4.6 against
 * jcenter(). None of those three is usable now: jcenter is sunset and
 * read-only, the `compile` configuration was removed in Gradle 7, and Gradle
 * 4.6 cannot parse a JDK 11 version string -- it fails with "Could not
 * determine java version from '11.0.32'", which is how this surfaced.
 *
 * AGP 4.2.2 on Gradle 6.7.1 is the pairing chosen: the oldest that accepts
 * JDK 11, and contemporary with Qt 5.15 so its deployment templates still
 * apply. Qt 5.15 is the ceiling here, not a preference -- see
 * tests/android/README.md.
 */

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.2'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'

dependencies {
    // `compile` was removed in Gradle 7 and is deprecated well before that.
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qt5AndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    compileSdkVersion androidCompileSdkVersion.toInteger()

    buildToolsVersion androidBuildToolsVersion

    /*
     * These have to be here, and the first version of this file left them out
     * on the reasoning that the manifest should be the single source. That
     * was wrong in a way the manifest cannot show: AGP replaces the manifest
     * uses-sdk with defaultConfig, and an unset defaultConfig.minSdkVersion
     * defaults to 1. The resulting APK declared minSdk 1 while the manifest
     * said 23, and `aapt2 dump badging` was the only place that showed it.
     * targetSdkVersion came out right by luck, AGP falling back to
     * compileSdkVersion.
     *
     * qtMinSdkVersion and qtTargetSdkVersion come from gradle.properties,
     * which androiddeployqt generates from the deployment settings, which
     * qmake fills from ANDROID_MIN_SDK_VERSION and ANDROID_TARGET_SDK_VERSION
     * in app.pri -- set there from the same VT_ANDROID_MIN_SDK and
     * VT_ANDROID_TARGET_SDK the manifest template uses. So there is still one
     * source; it just has to be plumbed through rather than assumed.
     */
    defaultConfig {
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qt5AndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qt5AndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qt5AndroidDir + '/res', 'res']
            resources.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    // Stated rather than inherited, so a toolchain change cannot move it.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    /*
     * Debuggable only when asked for, and only ever asked for by the
     * emulator harness.
     *
     * tests/android/emulator.sh sets escargotDebuggable in the gradle home
     * it controls, because a debuggable package is what makes `adb run-as`
     * work -- and that is the only way to seed the application's own
     * QSettings from outside. Without it, reaching the log settings on an
     * emulator means pixel-tapping a mandatory intro wizard and typing a
     * host into a 320px field, which is a test that passes until someone
     * moves a margin.
     *
     * It is off for every real build. A debuggable release package lets any
     * process on the device read this application's private data.
     */
    buildTypes {
        release {
            debuggable project.hasProperty('escargotDebuggable')
        }
    }

    lintOptions {
        abortOnError false

        /*
         * checkReleaseBuilds false disables the lintVitalRelease task, which
         * abortOnError does not cover: it is a separate release-gating task
         * and it fails the build even when lint itself is told not to.
         *
         * It has to go because AGP 4.2's lint crashes here, inside
         * LintCliClient.createLintRequest, and reports it as
         *
         *     Failed to parse XML in .../AndroidManifest.xml
         *
         * which is not true of that file. It is clean ASCII, its comment
         * delimiters balance, it has no duplicate attributes, and both
         * Python and AGP's own manifest merger parse it -- the merger runs
         * earlier in the same build and succeeds. The message is a wrapper
         * around a lint infrastructure error on JDK 11, not a fact about the
         * manifest.
         *
         * Nothing of value is lost here that this fork does not already
         * check: tests/android/manifest.py asserts the namespace, the
         * version code, the SDK levels, the exact permission set and the
         * service export, which is more than lint would have said.
         */
        checkReleaseBuilds false
    }
}
