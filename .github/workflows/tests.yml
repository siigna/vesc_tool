# Everything tests/check.sh runs, on every push and pull request.
#
# This fork's suite needs no board, no display server and no network, which is
# what makes it a reasonable thing to run in CI at all -- the whole of
# check.sh is about forty-five seconds once the toolchain is in place.
#
# Note on what this cannot prove: it was written and committed without being
# run on GitHub's runners, because this fork has never been pushed. Treat the
# first run as the test of the workflow rather than of the code.
name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Mutation testing only; see the job below for why it is not on every push.
  schedule:
    - cron: "37 5 * * 1"


# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Qt comes from the binary cache, but a cold cache still has to fetch it.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      # Separate from the test step so a cache miss or a broken flake reads as
      # its own failure rather than as a failing test.
      - name: Build the dev shell
        run: nix develop --command true

      # --build-app builds the application itself, which the cli suite runs
      # as a process -- about three and a half minutes, and without it that
      # suite has nothing to test in a fresh checkout. Everything else
      # check.sh builds for itself, per suite, from clean.
      #
      # One command rather than a build step plus a test step, so CI cannot
      # drift from what a developer runs.
      #
      # check.sh deliberately has no set -e: one failing suite must not stop
      # the others, and its exit code is the verdict.
      - name: tests/check.sh
        run: nix develop --command bash tests/check.sh --build-app

  # Mutation testing is fifteen rebuilds, which is the wrong trade for every
  # push. It runs on a schedule and on request, and its job is to catch a
  # check that has quietly stopped being able to fail.
  mutate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      # mutate.py runs qmake itself when a suite has no Makefile, and each
      # suite's run.sh finds its own Qt plugins, so this needs no setup and no
      # nested shell.
      - name: tests/mutate.py
        run: nix develop --command ./tests/mutate.py

  # Who actually wrote the content of the files this fork adds. Every time
  # something has been lifted out of an upstream file, the new file has been
  # created with this fork's header and only this fork's name -- twenty-four
  # times across four repositories before anyone looked. This is the check
  # that stops that happening to a contribution.
  #
  # On a pull request it audits only the files that PR touches, which takes
  # seconds; the weekly run audits everything.
  provenance:
    name: provenance of added files
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      # blame -C follows lines copied between files, so it needs the history.
      # A shallow clone makes every line look like it originated here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The audit itself lives in the firmware tree, which is the one place it
      # is maintained. Allowed to fail, and the step after reports a skip
      # rather than a pass, because a check that silently did not run is the
      # failure mode this whole exercise was about.
      - name: Check out the audit
        id: tool
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: siigna/bldc
          path: bldc_tool
          sparse-checkout: tests/provenance

      - name: Fetch upstream to compare against
        run: |
          set -e
          url=https://github.com/vedderb/vesc_tool
          git remote add upstream "$url" 2>/dev/null \
              || git remote set-url upstream "$url"
          git fetch --no-tags --quiet upstream master

      - name: Audit
        run: |
          set -e
          audit=bldc_tool/tests/provenance/audit.py

          if [ ! -f "$audit" ]; then
              echo "  skipped: could not check out the audit from siigna/bldc"
              exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch --no-tags --quiet origin "$GITHUB_BASE_REF"
              mapfile -t files < <(git diff --name-only \
                  "origin/$GITHUB_BASE_REF...HEAD")
              printf '%s file(s) changed by this pull request\n' "${#files[@]}"
              python3 "$audit" . upstream/master "${files[@]}"
          else
              python3 "$audit" . upstream/master
          fi
